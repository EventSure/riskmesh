[package]
name = "riskmesh-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "oracle-daemon"
path = "src/main.rs"

[dependencies]
# Web server
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# Solana
solana-client = "1.18"
solana-sdk    = "1.18"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (AviationStack + Switchboard Crossbar)
reqwest = { version = "0.12", features = ["json"] }

# Scheduling
tokio-cron-scheduler = "0.10"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"

# Utilities
anyhow    = "1"
tracing   = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv    = "0.15"
bs58      = "0.5"
borsh     = "0.10"
shellexpand = "3"
solana-account-decoder = "1.18"
sha2      = "0.10"
bincode   = "1"
base64    = "0.22"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
